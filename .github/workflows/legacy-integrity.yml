name: Frozen legacy integrity

on:
  pull_request:
    paths:
      - "legacy/**"
      - "config/legacy-tree-lock.json"
      - "tools/verify_legacy.py"
      - "tests/test_verify_legacy.py"
      - ".github/workflows/legacy-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout without persisted token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Check frozen legacy snapshot
        run: python3 tools/verify_legacy.py --json
      - name: Syntax check
        run: python3 -m compileall -q tools tests
