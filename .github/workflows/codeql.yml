name: codeql
on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          # python y javascript (javascript cubre también TypeScript).
          # Java se excluye: el único código Java es el bloque legacy de Android
          # (legacy/lupa/apps/android), que CodeQL no puede construir sin autobuild/SDK.
          languages: python,javascript
      - uses: github/codeql-action/analyze@v3
