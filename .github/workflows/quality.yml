name: quality
on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verificación de protocolos
        run: test -f README.md && test -f LICENSE && test -f .gitignore
      - name: Compilación Python (monorepo completo)
        run: python -m compileall -q . -x "(node_modules|\.venv|venv|build|dist)"
      - name: Tests raíz (protocolos, export y funciones puras)
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: "Sintaxis JS (excluye magic/plugin.js: TypeScript con extensión .js del snapshot legacy)"
        run: find . -name "*.js" -not -path "./node_modules/*" -not -name "*.min.js" -not -path "*/magic/plugin.js" | xargs -r -n1 node --check
