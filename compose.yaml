services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PVC_U_DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    image: nginx:stable-alpine
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./product/web:/usr/share/nginx/html:ro
      - ./product/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
